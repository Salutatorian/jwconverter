[package]
name = "jwconverter"
version = "0.1.0"
description = "JW Converter — local Windows audio conversion"
authors = ["JW"]
edition = "2021"

[lib]
name = "jwconverter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
uuid = { version = "1.24.0", features = ["v4"] }
